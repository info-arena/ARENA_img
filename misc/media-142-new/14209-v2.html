<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Attribution Graph</title>
    <script src="https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/d3.js"></script>
    <script src="https://transformer-circuits.pub/2025/attribution-graphs/static_js/lib/jetpack_2024-07-20.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2"></script>
    <style>
html, body { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; }
#container { width: 100%; height: 100%; }
/* style-cg.css */
.cg{
    .feature-detail{
        margin-top: 10px;
    }


    line-height: normal !important;

    text {
        cursor: default;
        /* text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff; */
        user-select: none;
    }

    svg {
        overflow: visible;
    }

    .h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      font-weight: 600;
    }

    .h4 {
      margin: 0 0 0 0;
      font-size: 13px;
      font-weight: 500;
    }

    .axis {
        .domain { display: none; }

        text { fill: #777; }
    }
    .prompt-token text {
        fill: #777;
        text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff;
    }

    .gridsnap-container {
        .grid-item {
            outline: 0 solid #fff;
        }
    }


    .link-graph, .feature-scatter, .feature-umap, .feature-diff-scatter, .link-diff-scatter {
        canvas{
            pointer-events: none;;
        }
        overflow: visible;
        .node {
            cursor: pointer;
        }


        .node.clicked {
            stroke-width: 1.5px;
            stroke: #f0f;
        }

        .node.pinned {
            stroke: #000;
            stroke-width: 1.8px;
        }

        .node.hidden {
            opacity: .5;
            r: .5;
        }

        .node.pinned.clicked {
            stroke-width: 2.3px;
            stroke: #f0f;
            /* stroke: url(#pinned-clicked-gradient); */
        }
    }

    .link-graph .node.hidden {
        opacity: 1 !important;
        font-size: 3.5px;
    }

    /* This is here for the diff view */
    .feature-detail {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;

        .h4 {
            padding-bottom: 5px;
            border-bottom: solid 1px #ccc;
        }

        .no-selected-feature{
            margin: 0 0 0 0;
            font-size: 13px;
            font-weight: 500;
        }

        /* Header section */
        .feature-header {
            flex-shrink: 0;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow-x: hidden;
            padding: 5px 0 0 0;
}

        .header-top-row {
            display: flex;
            align-items: center;
            column-gap: 10px;
            height: 20px;
        }

        .feature-title {
            flex: 0 0 auto;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 1px;
            padding: 1px 1px;

            /* disables feature link */
            a {
                pointer-events: none;
                text-decoration: none;
            }
        }
        .feature-title.hovered{
            text-decoration: underline;
            text-decoration-color: #f0f;
        }
        .feature-title.pinned{
            outline: 1px solid #000;
        }

        .feature-link {
            flex: 0 0 auto;
            font-size: 13px;
            margin-left: 5px;
            cursor: pointer;
            a {
                color: inherit;
                text-decoration: none;
            }
            &:hover {
                text-decoration: underline;
            }
        }

        /* CLERP sections */
        .pp-clerp {
            flex: 1 1 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            /* text-align: right; */
            font-size: 12px;
        }

        .pclerp {
            display: flex;
            padding: 0 0 6px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            align-items: baseline;

            > div {
                flex: 1 0 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
        }

        .edit-clerp-button {
            flex: 0 0 auto;
            overflow: hidden;
        }

        button{
            font-size: 10px;
            padding: 0 3px;
        }

        .clerp-edit {
            padding: 10px 0;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
            display: flex;
        }


        /* Examples section */
        .feature-examples-container {
            flex: 1;
            overflow-y: auto;
        }

        /* Logits section */
        .logits-container {
            padding-top: 6px;
            margin-bottom: 10px;
            font-size: 11px;
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            overflow-y: hidden;

            .effects {
                margin-top: 6px;
            }

            .sign {
                display: flex;
                align-items: center;
                gap: 3px;
                overflow: hidden;
            }

            .label {
                flex: 0 0 80px;
                color: hsl(0 0 0 / 0.5);
            }
            .rows {
                flex: 1 1 0;
                display: flex;
                gap: 3px;
                overflow: hidden;
            }
            .row {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                margin-top: 1px;
                padding-bottom: 1px;
            }

            .key {
                font-family: monospace;
                flex-grow: 1;
                color: hsl(0 0 0 / 0.5);
                background: hsl(0 0 0 / 0.08);
                border-radius: 4px;
                padding: 1px 3px;
                height: 14px;
            }

            .value {
                display: none;
                font-size: 9px;
                color: hsl(0 0 0 / 0.4)
            }
        }
    }


    .metadata {
        overflow-y: auto;
        font-family: monospace;
        font-size: 10px;
        color: #777;

        .row {
            padding-left: 15px;
            position: relative;
        }

        .toggle {
            position: absolute;
            left: 2px;
            cursor: pointer;
            user-select: none;
        }

        .children {
            padding-left: 15px;
        }
    }


    .button-container {
        display: flex;
        padding-left: 2px;
        overflow: hidden;

        .link-type-buttons,
        .toggle-buttons {
            display: flex;
            margin-right: 10px;

            div {
                margin: 0;
                padding: 8px;
                border: 1px solid #ccc;
                background: #fff;
                cursor: pointer;
                margin-left: -1px;
                user-select: none;
                display: flex;
                align-items: center;
                text-align: center;
                font-size: 12px;

                &:hover{
                    background: #eee;
                }

                &.active{
                    background: #000;
                    color: #fff;
                    border-color: #000;
                }
            }
        }

        .toggle-button:not(:last-child) {
            border-right: none;
        }

        .toggle-button:hover {
            background-color: #e0e0e0;
        }
    }

    .clerp-list{
        overflow-y: auto;
        overflow-x: scroll;
        padding: 0;

        .feature-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            display: inline-block;
        }
    }

    .clerp-list {
        font-size: 12px;
    }

    .feature-scatter,
    .feature-umap{
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;

        .chart-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;

            > div {
                width: 100%;
                height: 100%;
            }
        }
        select{
            font-family: system-ui;
            font-size: 12px;
            max-width: 100%;
        }
    }

    .feature-umap{
        .button {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            opacity: .4;
            margin-right: 20px;
            font-size: 12px;
        }

        .button.active {
            opacity: 1;
        }

        > div:first-child {
            display: flex;
            flex-direction: row;
            justify-content: center;
        }
    }

    .subgraph {
        overflow: hidden;
        /* outline: 1px solid #eee; */

        marker{
            orient: auto;
        }

        svg{
            z-index: -999999999;
        }

        .weight-label{
            /* text-shadow: #fff .2px 0 .2px, #fff -.2px 0 .2px, #fff 0 .2px .2px, #fff 0 -.2px .2px; */
            font-size: 9px;
            font-family: system-ui;
            text-anchor: middle;
            alignment-baseline: bottom;
            dy: -.5em;
            opacity: .8;
            fill: #999;
        }
        .layer-label{
            color: #999;
            opacity: .8;
            margin-right: 2px;
        }

        .supernode-container {
            position: absolute;
            /* border: 1px solid #ddd; */
            font-size: 9px;
            line-height: 1em;
            cursor: pointer;
            pointer-events: none;
            height: 1px;
            width: 1px;

            .node-text-container{
                /* overflow: hidden; */
                text-align: center;
                position: relative;
                top: 22px;
                text-shadow: 0 1px 0 #fff, 1px 0 0 #fff, 0 -1px 0 #fff, -1px 0 0 #fff, 1px 1px 0 #fff;
                pointer-events: all;
                color: #777;
                /* font-size: 12px; */
            }

            .temp-edit {
                width: 100px;
                font: inherit;
                border: none;
                padding: 0;
                margin: 0;
                background: none;
                outline: none;
                display: inline;
            }

            .clicked-weight {
                position: absolute;
                right: 0;
                padding: 1px 1px;
                font-size: 8px;
                overflow: visible;
            }
            .clicked-weight.source {
                bottom: -12px;
            }
            .clicked-weight.target {
                top: -12px;
            }

            .member-circles {
                pointer-events: all;
                position: absolute;
                top: 0;
                left: 50%;
                transform: translate(-50%);
                border: 1px solid #ddd;
                border-radius: 4px;
                padding: 4px;
                display: flex;
                background: #e5e3d7;
                outline: 1px solid #6f6d5e;
            }

            .member-circle {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #fff;
                display: inline-block;
                border: 1px solid #000;
                outline: .5px solid #000;
                z-index: 100 !important;
            }

            .not-clt-feature.member-circle{
                border-radius: 1.5px;
            }

            .member-circle:first-child {
                margin-left: 0;
            }
        }

        .ungroup-btn {
          display: none;
        }

        &.is-grouping .ungroup-btn {
          display: block;
        }


        .hovered.node .member-circles, .hovered.member-circle {
            border-color: rgba(0,0,0,0);
            outline: 1.5px dotted #f0f;
            z-index: 100;
        }

        .clicked.node .member-circles, .clicked.member-circle {
            border-color: rgba(0,0,0,0);
            outline: 1.5px solid #f0f;
        }

        .grouping-selected .member-circles{
          outline: 2px solid #0ff;
        }

        .checkbox-container{
            user-select: none;
            position: absolute;
            bottom: 0;
            color: #999;

            input{
                accent-color: #999;
            }

            label:not(:first-child){
                margin-left: 10px;
                display: inline-block;
            }
        }

        .is-supernode {
            padding-bottom: 15px;
        }


        .ungroup-btn {
            position: absolute;
            left: 0;
            bottom: 0;
            cursor: pointer;
            color: #0bb;
            z-index: 100;
            font-size: 12px;
            padding: 2px;

            &:hover {
                opacity: 1;
                color: #000;
                background: #0ff;
            }
        }

    }

    .feature-row {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        overflow: hidden;
        padding: 1px 3px;
        margin: 1px 0;
        border-radius: 8px;
        cursor: pointer;

        svg {
            width: 10px;
            height: 10px;
            margin-right: 4px;
        }
        .default-icon {
            fill: none;
            stroke: grey;
            stroke-width: .7;
            display: block;
        }

        .ctx-offset {
            flex: 1 0 5px;
            opacity: 0.5;
        }

        .layer {
            flex: 1 0 25px;
            opacity: 0.5;
        }

        .label {
            flex: 1 1 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .weight {
            flex: 1 0 35px;
            font-variant-numeric: tabular-nums;
        }
        &.hovered {
            outline: 3px dotted #f0f;
            z-index: 99;
            z-index: 100;
            position: relative;
        }
        &.clicked {
            outline: 1px solid #f0f;
            z-index: 999;
        }
        &.pinned .default-icon {
            stroke: #000 !important;
            stroke-width: 1.8px;
        }
        &.clicked circle {
            stroke: magenta;
            stroke-width: 1px;
        }

        &.hidden {
            opacity: .5;
            font-size: 7px;
            padding-top: 0;
            padding-bottom: 0;
        }

    }

    .feature-examples {

        .example-quantile {
            margin-bottom: 5px !important;
        }
        & .example-quantile {
            margin-top: 10px;

            .quantile-title {
                font-weight: 500 !important;
                font-size: 13px;
                /* margin-bottom: 5px; */
                width: 100%;
                padding-bottom: 5px;
                border-bottom: solid 1px #eee;
                display: block;
            }
        }

        .example-2-col > div{
            margin-bottom: 20px;;
        }

        .feature-example-logits{
            .ctx-container{
                border-bottom: solid 0 #fff !important;
                margin-bottom: -4px;
            }
        }
    }

    .node-connections {
        .header-top-row{
            user-select: none;
        }
        .feature-icon {
            color: #fff;
            -webkit-text-stroke: 1.5px #f0f;
            text-align: center;
            vertical-align: middle;
            margin-right: 5px;
            position: relative;
            top: -2px;
            font-size: 10px;
        }
        .feature-title{
            font-weight: 500 !important;
            font-size: 13px;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pinned .feature-icon{
            -webkit-text-stroke: 2.5px #f0f;
        }

        .connections {
            flex: 1 0 auto;
            display: flex;
            overflow-y: hidden;
            overflow-x: visible;
            gap: 200px;

            .features {
                display: flex;
                flex: 1 1 auto;
                flex-direction: column;
                min-width: 20px;
                width: 100%;
            }


            .effects {
                font-size: 11px;
                flex: 1 0 0;
                display: flex;
                flex-direction: column;
                overflow-y: scroll;
                overflow-x: visible !important;
                /* border-bottom: solid 1px #eee; */
                padding-top: 8px;
            }

            .h4 {
                padding-bottom: 5px;
                border-bottom: solid 1px #eee;
            }

            .h4 label {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            input {
                margin: 0;
            }
        }
        .sum-table table {
            width: 100%;
            border-collapse: collapse;
            font-weight: 300;
            color: rgb(85, 85, 85);
            line-height: 1em;
            margin-top: 4px;
            border-width: 0 !important;
            margin-bottom: 0;
            line-height: 1em;

            th, td {
                text-align: center;
                font-size: 11px !important;
                border-bottom-color: #fff !important;
                line-height: 1em;
            }

            th:not(:first-child), td:not(:first-child){
                padding-left: 0 !important;
                padding: 0 10px !important;
            }

            th {
                font-weight: 400;
            }

            tr{
                border-color: #fff !important;
            }

            tr.data td{
                font-variant-numeric: tabular-nums;
            }
        }
    }
}

/* style-feature-examples.css */
/* Style for feature examples */

.feature-examples {
    display: flex;
    flex-direction: column;
    position: relative;

    .example-2-col {
        flex: 1;
        overflow: visible;
        overflow-x: hidden;
        position: relative;
        z-index: 100;
    }

    .chart-row{
        display: grid;
        grid-template-columns: 2fr 1fr;
        &:has(> :only-child) {
            grid-template-columns: 1fr;
        }
        gap: 20px;
        line-height: 0;
    }

    .feature-example-list {
        margin-top: 10px;
    }

    .feature-example-histograms {
        margin-top: 25px;

        .histogram-container {
            display: flex;
            flex-direction: row;
            width: 100%;
        }

        .histogram-container .plotly-hist {
            width: 50%;
        }
    }

    .feature-example-logits {
        color: hsl(0 0 0 / 0.5);
        font-size: 10px;
        font-family: sans-serif;
        line-height: 14px;
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 100000;
        margin-bottom: -4px;
        padding-top: 15px;
        outline: 2px solid #fff;

        .section-title{
            margin-bottom: 3px;
        }

        .token {
            display: inline-block;
            margin-left: 0.2em;
            color: #444;
            background-color: #ddd;
            padding: 2px 4px !important;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre;
            overflow-y: hidden;
            vertical-align: middle;
            max-height: 13px;
            margin-right: 2px;
        }

        .logit-label {
            display: inline-block;
            margin-right: 7px;
            color: #aaa;
            padding-right: 3px;
        }
    }

    .example-2-col:not(:last-child) {
        margin-right: 10px;
    }

    .example-quantile {
        margin: 0;
        margin-top: 25px;
    }

    .train_token_ind {
        font-weight: bold;
        /* outline: 1px solid #000; */
    }

    .ctx-container {
        font-family: monospace;
        font-size: 11px;
        line-height: 11px;
        padding: 6px 0 4px;
        /* border-bottom: 1px solid #eee; */
        border-left: 2px solid rgba(0, 0, 0, 0);

        overflow: visible;
        white-space: nowrap;
        position: relative;
        a, .dataset-source{
            margin-right: 7px;
            color: #aaa;
            display: inline-block;
        }

        .dataset-source{
            padding-right: 3px;
            border-right: 1px solid #eee
        }
    }

    .is-repeated-datapoint{
        opacity: .2;
    }
    .is-repeated-datapoint:before {
        content: '⟳ ';
    }

    .ctx-container .token {
        border-radius: 4px;
        padding: 1px;
        cursor: default;
        white-space: pre;
    }

    .ctx-container .token:hover {
        outline: 1px solid #000;
    }

    .ctx-container .token.active {
        font-weight: bold;
        /* outline: 2px solid #000; */
        /* overflow: visible; */
    }

    svg{
        overflow: visible;
    }

    &.is-stale-output {
        td span, .text-wrapper, .token {
            opacity: 0;
        }
    }
}

/* style-gridsnap.css */
.gridsnap-container {
  position: relative;
  width: 100%;
  height: 100%;

  .grid-item {
    position: absolute;
    outline: 1px solid #eee;
  }

  .dragging {
    opacity: .5;
    z-index: 100;
  }

  .resize-handle,
  .move-handle {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 20px;
    font-size: 12px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    display: none;
    pointer-events: none;
    z-index: 100000000;

    .grid-item:hover & {
      display: flex;
      pointer-events: auto;
    }
  }

  .resize-handle {
    right: 0;
    cursor: se-resize;
  }

  .move-handle {
    right: 20px;
    cursor: move;
  }

  .preview {
    position: absolute;
    background: yellow;
    opacity: .3;
    pointer-events: none;
    z-index: 10;
  }

  .grid-contents{
    width: 100% !important;
    height: 100% !important;
  }
}

.gridsnap:not(.is-edit-mode) {
    .resize-handle,
    .move-handle {
        display: none !important;
    }
}

.gridsnap-container.dragging{
    .grid-item{
        outline: 3px solid #000;
    }
    .grid-contents{
        pointer-events: none;
    }
}

/* style.css */
html {
    margin: 0;
    background: #fff;
    font-family: system-ui;
}

body {
    margin: 10px;
}

.tooltip {
    top: -1000px;
    position: fixed;
    padding: 5px;
    background: rgba(255, 255, 255, 1);
    border: 1px solid lightgray;
    pointer-events: none;
    z-index: 10000;
    font-size: 10px;
    line-height: 1.3em;
}

.tooltip-hidden {
    opacity: 0;
    transition: all .3s;
    transition-delay: .1s;
}

text{
    cursor: default;
}

svg{
    overflow: visible;
    max-width: 100%;
    height: auto;
}

.cg-div{
    background: #fafafa;
    height: 800px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 40px 10px;
    margin: 60px -10px;
    width: calc(100% + 20px);
    grid-column: 1 / -1;
    position: relative;
    box-sizing: border-box;
    overflow-x: hidden;

    > .gridsnap{
        max-width: 1800px;
        margin: 0 auto;
    }

    .feature-example-logits{
        background: #fafafa !important;
        outline-color: #fafafa !important;
    }
}

d-article{
    overflow: visible;
}

.vis-link{
    margin: 0 auto;
    font-size: 12px;
    margin-top: -15px;
    margin-bottom: 1em;
}

.full_graph_link{
    cursor: pointer;
    text{
        cursor: pointer;
    }

    rect{
        transition: all 200ms;
    }

    &:hover rect{
        fill-opacity: 0.2;
    }
}

.graph-prompt-select {
    max-width: 40%;
    max-height: 4.8em;
    white-space: normal;
    display: flex;
    align-items: center;
    text-overflow: ellipsis;
    overflow: hidden;
    padding: 8px;

    <script>
// ── util.js ──
window.util = (function () {
  const params = (function(){
    const rv = {};

    rv.get = key => {
      const url = new URL(window.location);
      const searchParams = new URLSearchParams(url.search);

      const str = searchParams.get(key);
      return str && decodeURIComponent(str);
    };

    rv.getAll = () => {
      const url = new URL(window.location);
      const searchParams = new URLSearchParams(url.search);

      const values = {};
      for (const [key, value] of searchParams.entries()) {
        values[key] = decodeURIComponent(value);
      }
      return values;
    };

    rv.set = (key, value) => {
      const url = new URL(window.location);
      const searchParams = new URLSearchParams(url.search);

      if (value === null) {
        searchParams.delete(key);
      } else {
        searchParams.set(key, encodeURIComponent(value));
      }

      url.search = searchParams.toString();
      history.replaceState(null, '', url);
    };

    return rv;
  })();

  function addAxisLabel(c, xText, yText, title='', xOffset=0, yOffset=0, titleOffset=0){
    c.svg.select('.x').append('g')
      .translate([c.width/2, xOffset + 25])
      .append('text.axis-label')
      .text(xText)
      .at({textAnchor: 'middle', fill: '#000'});

    c.svg.select('.y')
      .append('g')
      .translate([yOffset -30, c.height/2])
      .append('text.axis-label')
      .text(yText)
      .at({textAnchor: 'middle', fill: '#000', transform: 'rotate(-90)'});

    c.svg
      .append('g.axis').at({fontFamily: 'sans-serif'})
      .translate([c.width/2, titleOffset -10])
      .append('text.axis-label.axis-title')
      .text(title)
      .at({textAnchor: 'middle', fill: '#000'});
  }

  function ggPlot(c){
    c.svg.append('rect.bg-rect')
      .at({width: c.width, height: c.height, fill: c.isBlack ? '#000' : '#EAECED'}).lower();
    c.svg.selectAll('.domain').remove();

    c.svg.selectAll('.x text').at({y: 4});
    c.svg.selectAll('.x .tick')
      .selectAppend('path').at({d: 'M 0 0 V -' + c.height, stroke: c.isBlack ? '#444' : '#fff', strokeWidth: 1});

    c.svg.selectAll('.y text').at({x: -3});
    c.svg.selectAll('.y .tick')
      .selectAppend('path').at({d: 'M 0 0 H ' + c.width, stroke: c.isBlack? '#444' : '#fff', strokeWidth: 1});

    ggPlotUpdate(c);
  }

  function ggPlotUpdate(c){
    c.svg.selectAll('.tick').selectAll('line').remove();

    c.svg.selectAll('.x text').at({y: 4});
    c.svg.selectAll('.x .tick')
      .selectAppend('path').at({d: 'M 0 0 V -' + c.height, stroke: c.isBlack ? '#444' : '#fff', strokeWidth: 1});

    c.svg.selectAll('.y text').at({x: -3});
    c.svg.selectAll('.y .tick')
      .selectAppend('path').at({d: 'M 0 0 H ' + c.width, stroke: c.isBlack? '#444' : '#fff', strokeWidth: 1});
  }

  function initRenderAll(fnLabels){
    const rv = {};
    fnLabels.forEach(label => {
      rv[label] = (ev) => Object.values(rv[label].fns).forEach(d => d(ev));
      rv[label].fns = [];
    });

    return rv;
  }

  function attachRenderAllHistory(renderAll, skipKeys=['hoverId', 'hoverIdx']) {
    // Add state pushing to each render function
    Object.keys(renderAll).forEach(key => {
      renderAll[key].fns.push(() => {
        if (skipKeys.includes(key)) return;
        const simpleVisState = {...visState};
        skipKeys.forEach(key => delete simpleVisState[key]);

        const url = new URL(window.location); 
        if (visState[key] == url.searchParams.get(key)) return;
        url.searchParams.set(key, simpleVisState[key]);
        history.pushState(simpleVisState, '', url);
      });
    });

    // Handle back/forward navigation
    d3.select(window).on('popstate.updateState', ev => {
      if (!ev.state) return;
      ev.preventDefault();
      Object.keys(renderAll).forEach(key => {
        if (skipKeys.includes(key)) return; 
        if (visState[key] == ev.state[key]) return;
        visState[key] = ev.state[key];
        renderAll[key]();
      });
    });
  }

  function throttle(fn, delay){
    let lastCall = 0;
    return (...args) => {
      if (Date.now() - lastCall < delay) return;
      lastCall = Date.now();
      fn(...args);
    };
  }

  function debounce(fn, delay) {
    let timeout;
    return (...args) => {
      clearTimeout(timeout);
      timeout = setTimeout(() => fn(...args), delay);
    };
  }

  function throttleDebounce(fn, delay) {
    let lastCall = 0;
    let timeoutId;

    return function (...args) {
      clearTimeout(timeoutId);
      const remainingDelay = delay - (Date.now() - lastCall);
      if (remainingDelay <= 0) {
        lastCall = Date.now();
        fn.apply(this, args);
      } else {
        timeoutId = setTimeout(() => {
          lastCall = Date.now();
          fn.apply(this, args);
        }, remainingDelay);
      }
    };
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function cache(fn){
    const cache = {};
    return function(...args){
      const key = JSON.stringify(args);
      if (!(key in cache)) cache[key] = fn.apply(this, args);
      return cache[key];
    };
  }

        .selectAppend('div.tooltip.feature-examples-tooltip.tooltip-hidden')
        .on('mouseover', mousemove)
        .on('mousemove', mousemove) 
        .on('mouseleave', mouseout);

      // Add touch event handler to body
      d3.select('body').on('click.feature-tooltip', ev => {

      });

      d3.select(window).on('scroll.feature-examples-tooltip', () => {
        if (featureExamplesTooltipSel.isFading || featureExamplesTooltipSel.isFaded) return;

      featureExamplesTooltipSel.append('div.feature-nav');
      featureExamples = window.initFeatureExamples({

        hideStaleOutputs: true,
      });

      if (window.__feature_tooltip_queue_timer) __feature_tooltip_queue_timer.stop();
      window.__feature_tooltip_queue_timer = d3.timer(() => {
        if (!featureQueue.length) return;
        const feature = featureQueue.pop();
        featureExamples.loadFeature(feature.scan, feature.layer, feature.featureIndex);
      }, 250);
    }

      .on('mouseleave.feature-examples-tooltip', mouseout)
      .on('mouseenter.feature-examples-tooltip', function(ev, d){

        if (featureExamplesTooltipSel.cur == d && !featureExamplesTooltipSel.classed('tooltip-hidden')) return;

  function clerpUUID(d){
    return '🤖' + d.featureIndex;
  }

  function parseClerpUUID(str){
    const [featureIndex] = str.split('🤖');
    return {featureIndex};
  }

  function saveHClerpsToLocalStorage(hClerps) {
    const key = 'local-clerp';
    const hClerpArray = Array.from(hClerps.entries()).filter(d => d[1]);
    window.rootData[key] = JSON.stringify(hClerpArray);
  }

  function getHClerpsFromLocalStorage() {
    const key = 'local-clerp';
    // We want to set on load here so that any page load will fix the key.
    if (window.rootData[key] == null) window.rootData[key] = '[]';
    const hClerpArray = JSON.parse(window.rootData[key])
      .filter(d => d[0] != clerpUUID({}));
    return new Map(hClerpArray);
  }

  function hClerpUpdateFn(params, data){

    const localClerps = getHClerpsFromLocalStorage();
    if (params) {
      const [node, hClerp] = params;
      localClerps.set(clerpUUID(node), hClerp);
      saveHClerpsToLocalStorage(localClerps);
    }

    data.features.forEach(node => {
      node.localClerp = localClerps.get(clerpUUID(node));
      node.ppClerp = node.localClerp || node.remoteClerp || node.clerp;
    });

    data.nodes?.forEach(node => {
      const feature = data.features.idToFeature[node.featureId];
      if (!feature) return;
      node.localClerp = feature.localClerp;
      node.ppClerp = feature.ppClerp;
    });
  }

  // Adds virtual logit node showing A-B logit difference based on url param logitDiff=⍽tokenA⍽__vs__⍽tokenB⍽
  function addVirtualDiff(data){
    // Filter out any previous virtual nodes/links
    let nodes = data.nodes.filter(d => !d.isJsVirtual);
    let links = data.links.filter(d => !d.isJsVirtual);
    nodes.forEach(d => d.logitToken = d.clerp?.split(`"`)[1]?.split(`" k(p=`)[0]);

    let [logitAStr, logitBStr] = util.params.get('logitDiff')?.split('__vs__') || [];
    if (!logitAStr || !logitBStr) return {nodes, links};
    let logitANode = nodes.find(d => d.logitToken == logitAStr);
    let logitBNode = nodes.find(d => d.logitToken == logitBStr);
    if (!logitANode || !logitBNode) return {nodes, links};

    const virtualId = `virtual-diff-${logitAStr}-vs-${logitBStr}`;
    const diffNode = {
      ...logitANode,
      node_id: virtualId,
      js_node_id: virtualId,
      feature: virtualId,
      isJsVirtual: true,
      logitToken: `${logitAStr} - ${logitBStr}`,
      clerp: `Logit diff: ${logitAStr} - ${logitBStr}`,
    };
    nodes.push(diffNode);

    let targetLinks = links.filter(d => d.target == logitANode.node_id || d.target == logitBNode.node_id);
    d3.nestBy(targetLinks, d => d.source).map(sourceLinks => {
      let linkA = sourceLinks.find(d => d.target == logitANode.node_id);
      let linkB = sourceLinks.find(d => d.target == logitBNode.node_id);

      links.push({
        source: sourceLinks[0].source,
        target: diffNode.node_id,
        weight: (linkA?.weight || 0) - (linkB?.weight || 0),
        isJsVirtual: true
      });
    });

    return {nodes, links};
  }

  // Decorates and mutates data.json
  // - Adds pointers between node and links
  // - Deletes very common features
  // - Adds data.features and data.byStream
  async function formatData(data, visState){
    console.log('[cg] formatData: starting with', data.nodes?.length, 'nodes,', data.links?.length, 'links');
    const {metadata} = data;
    let {nodes, links} = addVirtualDiff(data);

    const py_node_id_to_node = {};
    const idToNode = {};
    const maxLayer = d3.max(nodes.filter(d => d.node_type != 'logit'), d => +d.layer);
    nodes.forEach((d, i) => {
      // To make hover state work across prompts, drop ctx from node id
      d.featureId = `${d.layer}_${d.feature}`;

      d.active_feature_idx = d.feature;
      d.nodeIndex = i;

      if (d.node_type == 'logit') d.layer = maxLayer + 1;
      
      // TODO(mcdougallc) - does this handle error nodes correctly?
      if (d.node_type == 'unexplored node' && !d.layer != 'E'){
        d.node_type = 'latent';
      }
      
      // count from end to align last token on diff prompts
      d.ctx_from_end = data.metadata.prompt_tokens.length - d.ctx_idx;

      // add clerp to embed and error nodes
      if (d.node_type.includes('error')){
        d.isError = true;

        if (!d.featureId.includes('__err_idx_')) d.featureId = d.featureId + '__err_idx_' + d.ctx_from_end;

        if (d.node_type == 'mlp_error'){
          d.clerp = `Err: mlp “${util.ppToken(data.metadata.prompt_tokens[d.ctx_idx - 1])}"`;
        }
      } else if (d.node_type == 'embedding'){
        d.clerp = `Emb: “${util.ppToken(data.metadata.prompt_tokens[d.ctx_idx - 1])}"`;
      }

      d.url = d.vis_link;
      d.isFeature = true;

      d.targetLinks = [];
      d.sourceLinks = [];

      // TODO(mcdougallc) - switch to featureIndex in graphgen
      d.featureIndex = d.feature;

      d.nodeId = d.js_node_id;
      if (d.node_type == 'logit' && d.clerp) d.logitPct= +d.clerp.split('(p=')[1].split(')')[0];
      idToNode[d.nodeId] = d;
      py_node_id_to_node[d.node_id] = d;
    });
      
    // Delete features with density > 50%
    const deletedFeatures = [];
    const byFeatureId = d3.nestBy(nodes, d => d.featureId);
    byFeatureId.forEach(feature => {
      // if (feature.length > metadata.prompt_tokens.length*1/2){
      if (feature.some(d => d.feature_density > 0.5)){
        deletedFeatures.push(feature);
        feature.forEach(d => {
          delete idToNode[d.nodeId];
          delete py_node_id_to_node[d.node_id];
        });
      }
    });

    if (deletedFeatures.length) console.log({deletedFeatures});
    nodes = nodes.filter(d => idToNode[d.nodeId]);
    nodes = d3.sort(nodes, d => +d.layer);

    links = links.filter(d => py_node_id_to_node[d.source] && py_node_id_to_node[d.target]);

    // connect links to nodes
    links.forEach(link => {
      link.sourceNode = py_node_id_to_node[link.source];
      link.targetNode = py_node_id_to_node[link.target];

      link.linkId = link.sourceNode.nodeId + '__' + link.targetNode.nodeId;

      link.sourceNode.targetLinks.push(link);
      link.targetNode.sourceLinks.push(link);
      link.absWeight = Math.abs(link.weight);
    });
    links = d3.sort(links, d => d.absWeight); 
    

    nodes.forEach(d => {
      d.inputAbsSum = d3.sum(d.sourceLinks, e => Math.abs(e.weight));
      d.sourceLinks.forEach(e => e.pctInput = e.weight/d.inputAbsSum);
      d.inputError = d3.sum(d.sourceLinks.filter(e => e.sourceNode.isError), e => Math.abs(e.weight));
      d.pctInputError = d.inputError/d.inputAbsSum;
    });

    // convert layer/probe_location_idx to a streamIdx used to position nodes
    let byStream = d3.nestBy(nodes, d => [d.layer, d.probe_location_idx] + '');
    byStream = d3.sort(byStream, d => d[0].probe_location_idx);
    byStream = d3.sort(byStream, d => d[0].layer == 'E' ? -1 : +d[0].layer);
    byStream.forEach((stream, streamIdx) => {
      stream.forEach(d => {
        d.streamIdx = streamIdx;
        d.layerLocationLabel = layerLocationLabel(d.layer, d.probe_location_idx);
        
        if (!visState.isHideLayer) d.streamIdx = isFinite(d.layer) ? +d.layer : 0;
      });
    });

    // add target_logit_effect__ columns for each logit
    const logitNodeMap = new Map(nodes.filter(d => d.isLogit).map(d => [d.node_id, d.logitToken]));
    nodes.forEach(node => {
      node.targetLinks.forEach(link => {
        if (!logitNodeMap.has(link.target)) return;
        node[`target_logit_effect__${logitNodeMap.get(link.target)}`] = link.weight;
      });
    });

    // add ppClerp
    await Promise.all(nodes.map(async d => {
      if (!d.clerp) d.clerp = '';
      d.remoteClerp = '';
    }));

    // condense nodes into features, using last occurrence of feature if necessary to point to a node
    const features = d3.nestBy(nodes.filter(d => d.isFeature), d => d.featureId)
      .map(d => ({
        featureId: d[0].featureId,
        node_type: d[0].node_type,
        clerp: d[0].clerp,
        remoteClerp: d[0].remoteClerp,
        layer: d[0].layer,
        streamIdx: d[0].streamIdx,
        probe_location_idx: d[0].probe_location_idx,
        featureIndex: d[0].featureIndex,
        top_logit_effects: d[0].top_logit_effects,
        bottom_logit_effects: d[0].bottom_logit_effects,
        top_embedding_effects: d[0].top_embedding_effects,
        bottom_embedding_effects: d[0].bottom_embedding_effects,
        url: d[0].url,
        lastNodeId: d.at(-1).nodeId,
        isLogit: d[0].isLogit,
        isError: d[0].isError,
        node_type: d[0].node_type,
      }));

    nodes.idToNode = idToNode;
    features.idToFeature = Object.fromEntries(features.map(d => [d.featureId, d]));
    links.idToLink = Object.fromEntries(links.map(d => [d.linkId, d]));

    Object.assign(data, {nodes, features, links, byStream});
  }

  function addFeatureEvents(visState, renderAll) {
    return function(selection) {
      selection
        .on('mouseover', (ev, d) => {
          if (ev.shiftKey) return;
          if (visState.subgraph?.activeGrouping.isActive) return;
          ev.preventDefault();
          hoverFeature(visState, renderAll, d);
        })
        .on('mouseout', (ev, d) => {
          if (ev.shiftKey) return;
          if (visState.subgraph?.activeGrouping.isActive) return;
          ev.preventDefault();
          unHoverFeature(visState, renderAll);
        })
        .on('click', (ev, d) => {
          if (visState.subgraph?.activeGrouping.isActive) return;
          clickFeature(visState, renderAll, d, ev.metaKey || ev.ctrlKey);
        });
    };
  }

  function hoverFeature(visState, renderAll, d) {
    if (d.nodeId.includes('supernode-')) return;

    if (visState.hoveredId != d.featureId) {
      visState.hoveredId = d.featureId;
      visState.hoveredCtxIdx = d.ctx_idx;
      renderAll.hoveredId();
    }
  }

  function unHoverFeature(visState, renderAll) {
    if (visState.hoveredId) {
      visState.hoveredId = null;
      visState.hoveredCtxIdx = null;
      setTimeout(() => {
        if (!visState.hoveredId) renderAll.hoveredId();
      });
    }
  }
  function togglePinned(visState, renderAll, d) {
    const index = visState.pinnedIds.indexOf(d.nodeId);
    if (index == -1) {
      visState.pinnedIds.push(d.nodeId);
    } else {
      visState.pinnedIds.splice(index, 1);
    }
    renderAll.pinnedIds();
  }

  function clickFeature(visState, renderAll, d, metaKey){
    // console.log(d);
    if (d.nodeId.includes('supernode-')) return;

    if (metaKey && visState.isEditMode) {
      togglePinned(visState, renderAll, d); 
    } else {
      if (visState.clickedId == d.nodeId) {
        visState.clickedId = null;
        visState.clickedCtxIdx = null;
      } else {
        visState.clickedId = d.nodeId;
        visState.clickedCtxIdx = d.ctx_idx;
      }
      visState.hoveredId = null;
      visState.hoveredCtxIdx = null;
      renderAll.clickedId();
    }
  }

    const tooltipSel = d3.select('.tooltip');
    if (!tooltipSel.node()) {
      console.warn('[cg] showTooltip: no .tooltip element in DOM');
      return;
    }
    const x = ev.clientX,
        y = ev.clientY,
        bb = tooltipSel.node().getBoundingClientRect(),
        left = d3.clamp(20, (x-bb.width/2), window.innerWidth - bb.width - 20),
        top = window.innerHeight > y + 20 + bb.height ? y + 20 : y - bb.height - 20;

    let tooltipHtml = !ev.metaKey ? `F#${d.feature}${d.ppClerp ? `<br>${d.ppClerp}` : ''}` : Object.keys(d)
      .filter(str => typeof d[str] != 'object' && typeof d[str] != 'function' && !keysToSkip.has(str))
      .map(str => {
        let val = d[str];
        if (typeof val == 'number' && !Number.isInteger(val)) val = val.toFixed(6);
        return `<div>${str}: <b>${val}</b></div>`;
      })
      .join('');

    tooltipSel
      .style('left', left +'px')
      .style('top', top + 'px')
      .html(tooltipHtml)
      .classed('tooltip-hidden', false);

          .join('');

  function updateFeatureStyles(nodeSel){
    nodeSel.call(classAndRaise('hovered', e => e.featureId == visState.hoveredId));

    const pinnedIdSet = new Set(visState.pinnedIds);
    nodeSel.call(classAndRaise('pinned', d => pinnedIdSet.has(d.nodeId)));

    const hiddenIdSet = new Set(visState.hiddenIds);
    nodeSel.call(classAndRaise('hidden', d => hiddenIdSet.has(d.featureId)));

    if (nodeSel.datum().nodeId){
      nodeSel.call(classAndRaise('clicked', e => e.nodeId === visState.clickedId));

      nodeSel.call(classAndRaise('clicked', d => d.featureId == visState.clickedId));

  const memoize = fn => {

      if (cache.has(key)) return cache.get(key);
      const result = fn(...args);
      cache.set(key, result);
      return result;
    };

        <stop offset='70%'  stop-color='#f0f' />
        <stop offset='71%'  stop-color='#000' />
        <stop offset='100%' stop-color='#000' />
      </linearGradient>
    `);
  }

  function renderFeatureRow(sel, visState, renderAll, linkKey='tmpClickedLink'){
    sel.st({
      background: d => d[linkKey]?.tmpColor,
      color: d => bgColorToTextColor(d[linkKey]?.tmpColor, '#eee', '#555'),
    });

    // add events in a timeout to avoid connection clicks leading to an instant hover
    setTimeout(() => sel.call(addFeatureEvents(visState, renderAll)), 16);

    const featureIconSel = sel.append('svg')
      .at({width: 10, height: 10});

    let featureIcon = featureIconSel.append('g');

    featureIcon.append('g.default-icon').append('text')
      .text(d => featureTypeToText(d.node_type))
      .at({
        fontSize: 9,
        textAnchor: 'middle',
        dominantBaseline: 'central',
        dx: 5,
        dy: 4,
      })
      .at({fill: d => d[linkKey]?.tmpColor});


    sel.append('div.label')
      .text(d => d.ppClerp)
      .at({ title: d => d.ppClerp });

    sel
      .filter(d => d[linkKey] && d[linkKey].tmpClickedCtxOffset != 0)
      .append('div.ctx-offset')
      .text(d => d[linkKey].tmpClickedCtxOffset < 0 ? '←' : '→');

    if (!visState.isHideLayer){
      sel.append('div.layer')
        .text(d => d.layerLocationLabel ?? layerLocationLabel(d.layer, d.probe_location_idx));
    }

    sel.append('div.weight')
      .text(d => d[linkKey] ? d3.format('+.3f')(d[linkKey].weight) : '');
      // .text(d => d[linkKey] ? d3.format('+.3f')(d[linkKey].pctInput) : '');
  }

  function featureTypeToText(type){
    if (type === 'logit') return '■';
    if (type == 'embedding') return '■';
    if (type === 'mlp_error') return '◆';
    return '●';

  }


  return {
    formatData,
    addFeatureEvents,
    hoverFeature,
    unHoverFeature,
    clickFeature,
    layerLocationLabel,
    keysToSkip,
    addFeatureTooltip,
    showTooltip,
    hideTooltip,
    updateFeatureStyles,
    memoize,
    bgColorToTextColor,
    addPinnedClickedGradient,
    renderFeatureRow,
    saveHClerpsToLocalStorage,
    getHClerpsFromLocalStorage,
    hClerpUpdateFn,
    featureTypeToText,
  };
})();

/**
 * Initializes the gridsnap visualization, which allows users to drag and resize
 * a grid of items.
 *
 * @param {!Object=} options - config object
 * @return {!Object} - functions for rendering data
 */
window.initGridsnap = function({
  gridData = [],
  maxX = null,
  isFullScreenY = true,
  pad = 10,
  gridSizeY = 80,
  isFillContainer = false,
  sel = d3.select('.gridsnap'),
  repositionFn = null,
  serializedGrid = '',
} = {}){
  const gridsnap = {gridData, serializeGrid, deserializeGrid};

  // Add a `next` property to each grid item. This is used to store the
  // temporary position/size of the grid item while it is being dragged or
  // resized, before it is snapped to the grid and committed to `d.cur`.
  gridData.forEach((d, i) => {
    d.next = {...d.cur};
    d.class = d.class === undefined ? i : d.class;
  });

  maxX = maxX || d3.max(gridData, d => d.cur.x + d.cur.w);
  function calcgridSizeX(){ 
    // Calculate the size of the grid in the x direction, based on the width of the container
    return (sel.node().offsetWidth)/maxX;
  }
  let gridSizeX = calcgridSizeX();

  function calcGridSizeY() {
    // Calculate the size of the grid in the y direction, based on the height of the container
    if (!isFillContainer) return gridSizeY;
    return sel.node().offsetHeight/(d3.max(gridData, d => d.cur.y + d.cur.h) || 1);
  }

  gridSizeY = calcGridSizeY();

  const resizeKey = 'resize.gridsnap' + serializedGrid;
  d3.select(window).on(resizeKey, util.throttle(() => {
    // Recalculate grid size and re-render when the window is resized
    const newX = calcgridSizeX();
    const newY = calcGridSizeY();
    if (newX == gridSizeX && newY == gridSizeY) return;

    gridSizeX = newX;
    gridSizeY = newY;
    renderPositions();


    gridItemSel.each(d => d.resizeFn?.());
  }, 500));

  const gridsnapSel = sel.html('').append('div.gridsnap-container');

  // Create a div for each grid item, and add a 'grid-contents' div inside it
  // which will contain the content of the grid item.
  const gridItemSel = gridsnapSel.appendMany('div.grid-item', gridData)
    .each(function(d){ d.sel = d3.select(this).append('div.grid-contents').classed(d.class, 1); });

  // Add move and resize handles to each grid item. These allow the user to
  // drag and resize the grid items.
  gridItemSel.append('div.move-handle')
    .text('✣')
    .call(makeDragFn(false));
  gridItemSel.append('div.resize-handle')
    .text('↘')
    .call(makeDragFn(true));

  const previewSel = gridsnapSel.append('div.preview.grid-item');

  function makeDragFn(isResize) {
    return d3.drag()
      .subject((ev, d) => ({
        x: (d.cur.x + (isResize ? d.cur.w : 0))*gridSizeX,
        y: (d.cur.y + (isResize ? d.cur.h : 0))*gridSizeY
      }))
      .container(function(){ return this.parentNode.parentNode; })
      .on('start', function(ev, d){
        // When a drag starts, store the current position of the grid item in
        // `d.dragStart`, and copy the current position to `d.next`.
        gridData.forEach(d => d.next = {...d.cur});
        d.dragStart = {...d.cur};

        gridsnapSel.classed('dragging', 1);
        d3.select(this.parentNode).classed('dragging', 1);
        previewSel.st({'display': ''});
      })
      .on('end', (ev, d) => {
        // When a drag ends, update the current position of the grid item by
        // copying the temporary position from `d.next` to `d.cur`.
        gridData.forEach(d => d.cur = {...d.next});

        gridsnapSel.classed('dragging', 0);
        gridItemSel.classed('dragging', 0);
        previewSel.st({'display': 'none'});
        renderPositions();

        if (isResize) d.resizeFn?.();
      })
      .on('drag', isResize ? resize : drag);

    // The `drag` function is called when a user drags a grid item by its
    // move handle. It updates the x and y position of the grid item,
    // preserving its width and height.
    function drag(ev, d) {
      d.cur.x = ev.x/gridSizeX;
      d.cur.y = ev.y/gridSizeY;

      pushGrid(d);
      renderPositions(d);
    }

    function resize(ev, d) {
      // The `resize` function is called when a user drags a grid item by its
      // resize handle. It updates the width and height of the grid item,
      // while preserving its top-left corner.
      //
      // To do this, we first set the x and y position back to the values
      // stored in `d.dragStart`. Then, we calculate the new width and height
      // based on the mouse position during the drag.
      d.cur.x = d.dragStart.x;
      d.cur.y = d.dragStart.y;

      d.cur.w = ev.x/gridSizeX - d.dragStart.x;
      d.cur.h = ev.y/gridSizeY - d.dragStart.y;
      if (d.cur.w < 0) {
        d.cur.x += d.cur.w;
        d.cur.w = d.dragStart.w - d.cur.w;
      }
      if (d.cur.h < 0) {
        d.cur.y += d.cur.h;
        d.cur.h = d.dragStart.h - d.cur.h;
      }

      pushGrid(d);
      renderPositions(d);
    }
  }


  function pushGrid(active) {
    // After a grid item has been moved or resized, snap it to the grid,
    // and then push all the grid items down to make sure they don't overlap.
    if (active) active.next = snapToGrid(active.cur);

    let sortedGridData = d3.sort(gridData, d => d != active);
    sortedGridData = d3.sort(sortedGridData, d => d == active ? d.cur.y : d.next.y);

    const topArray = d3.range(maxX).map(d => 0);
    sortedGridData.forEach(d => {
      const {x, y, w, h} = d.next;
      // Calculate the y position of the grid item, so that it is placed
      // below any other grid items that overlap with it.
      d.next.y = d3.max(d3.range(w), i => topArray[x + i]);
      d3.range(w).forEach(i => topArray[x + i] = d.next.y + h);
    });

    function snapToGrid({x, y, w, h}) {
      const rv = {x: Math.max(0, Math.round(x)), y: Math.max(0, Math.round(y)), w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h))};
      if (rv.x + rv.w > maxX) rv.x = Math.max(0, maxX - rv.w);
      // Snap the grid item to the grid, so that its top-left corner is aligned
      // with the grid.
      return rv;
    }
  }

  function renderPositions(active){
    gridItemSel.call(renderGridItem, 'next');

    // If there is an active grid item (i.e. one that is currently being dragged
    // or resized), render it in its current position.
    if (active){
      gridItemSel.filter(d => d == active).call(renderGridItem, 'cur');
      previewSel.datum(active).call(renderGridItem, 'next');
    } else{
      if (!isFillContainer){
        maxY = Math.max(maxY, d3.max(gridData, d => d.next.y + d.next.h));
        gridsnapSel.st({height: Math.max(isFullScreenY ? window.innerHeight : 0, maxY*gridSizeY + pad) + 'px'});
      }
    }

    repositionFn?.(gridsnap);

    function renderGridItem(itemSel, key) {
      // Set the position and size of the grid item, based on the values in `d[key]`.
      // This is used to render both the current and temporary positions of the grid items.
      itemSel
        .translate(d => [d[key].x*gridSizeX + pad/2, d[key].y*gridSizeY + pad/2].map(Math.round))
        .st({
          width: d => Math.round(Math.max(0, d[key].w*gridSizeX - pad)), // negative sizes bug out
          height: d => Math.round(Math.max(0, d[key].h*gridSizeY - pad))
        });
    }
  }

  function serializeGrid(){
    // Serialize the grid data into a string, which can be used to save the current
    // grid layout. Each grid item is represented by its class name and its
    // x, y, width, and height, all encoded as two-digit numbers.
    return gridData.map(d => {
      const {x, y, w, h} = d.cur;
      return `${d.class}${[x, y, w, h].map(d3.format('02d')).join('')}`;
    }).join('_');
  }

  // Deserialize the grid data from a string, which can be used to restore a previous
  // grid layout. The string is expected to be in the format produced by
  // `serializeGrid`.
  function deserializeGrid(serializedGrid){
    serializedGrid?.split('_').forEach(str => {
      const match = str.match(/^([\w-]+)(\d{8})$/);
      if (!match) return;
      const [_, className, coords] = match;

      // parse the coordinates
      const [x, y, w, h] = d3.range(4).map(i => +coords.substr(i*2, 2));
      const gridItem = gridData.find(d => d.class == className);
      if (gridItem) gridItem.next = {x, y, w, h};
    });

    pushGrid();
    gridData.forEach(d => d.cur = {...d.next});
    // After deserializing, render the grid with the new positions and sizes of
    // the grid items.
    renderPositions();
  }

  // Render initial positions on load (not just on resize)
  if (serializedGrid) {
    deserializeGrid(serializedGrid);
  } else {
    pushGrid();
    renderPositions();
  }

  return gridsnap;
};

window.init?.();

/**
 * - Initializes the button container for the control flow graph visualization.
 * - Creates buttons for toggling link types, showing all links, clearing pinned 
 *   & clicked nodes, resetting the grid, and enabling sync.
 * - Manages the state of these buttons and their interactions with the vis.
 *
 * @param {{visState: !Object, renderAll: !Object, cgSel: !d3.Selection}} options
 *   - visState: The current state of the visualization.
 *   - renderAll: The object containing functions to render the visualization.
 *   - cgSel: The d3 selection for the control flow graph.
 */
window.initCgButtonContainer = function({visState, renderAll, cgSel}){
  // Select the button container element and clear its previous content.
  const buttonContainer = cgSel.select('.button-container').html('')
    .st({marginBottom: '10px'});

  // Create buttons for selecting the link type (input, output, either, both).
  // These buttons will update the visualization to show only the selected link type.
  const linkTypeSel = buttonContainer.append('div.link-type-buttons')
    .appendMany('div', ['input', 'output', 'either', 'both'])
    .text(d => d[0].toUpperCase() + d.slice(1).toLowerCase())
    .on('click', (ev, d) => {
      visState.linkType = d;
      renderAll.linkType();
    });
  // Add a function to update the active state of the link type buttons.
  renderAll.linkType.fns.push(() => {
    linkTypeSel.classed('active', d => d === visState.linkType);
  });
  // Create a button to toggle showing all links.
  // This button will update the visualization to show all links or only the links related to the selected node.
  const showAllSel = buttonContainer.append('div.toggle-buttons')
    .append('div').text('Show all links')
    .on('click', () => {
      visState.isShowAllLinks = visState.isShowAllLinks ? '' : '1';
      renderAll.isShowAllLinks();
    });
  // Add a function to update the active state of the show all links button.
  renderAll.isShowAllLinks.fns.push(() => {
    showAllSel.classed('active', visState.isShowAllLinks);
  });

  // Create buttons to clear pinned or clicked nodes.
  // These buttons will reset the visualization to remove any pinned or clicked nodes.
  buttonContainer.append('div.toggle-buttons')
    .appendMany('div', ['Clear pinned', 'Clear clicked'])
    .text(d => d)
    .on('click', (ev, d) => {
      if (d == 'Clear pinned') {
        visState.pinnedIds = [];
        renderAll.pinnedIds();
      } else {
        visState.clickedId = '';
        renderAll.clickedId();
      }
    });

  // Add a keydown event listener to clear the clicked node when the escape key is pressed.
  cgSel.on('keydown.esc-check', ev => {
    if (ev.key == 'Escape') {
      visState.clickedId = '';
      renderAll.clickedId();
    }
  });

  // Create a button to reset the grid layout.
  // This button will reset the grid to its default state.
  buttonContainer.append('div.toggle-buttons')
    .append('div').text('Reset grid')
    .on('click', () => {
      util.params.set('gridsnap', ''); // TODO(mcdougallc): this won't work with baked in features
      window.location.reload();
    });

  // Create a button to enable or disable sync between visualizations.
  // This button will toggle the sync state of the visualization.
  const onSyncValue = visState.isSyncEnabled || '1';
  const syncButtonSel = buttonContainer.append('div.toggle-buttons')
    .append('div').text('Enable sync')
    .on('click', () => {
      visState.isSyncEnabled = visState.isSyncEnabled ? '' : onSyncValue;
      renderAll.isSyncEnabled();
    });

    // Add a function to update the active state of the sync button.
    renderAll.isSyncEnabled.fns.push(() => {
    syncButtonSel.classed('active', visState.isSyncEnabled);
  });

};

window.init?.();

/**
 * - Initializes the control flow graph (CG) clerp list, which displays values
 *   of nodes in the CG grouped by token & layer.
 * - Used to visualize node values & select nodes for further analysis.
 * - Works by adding functions to `renderAll` which are called when bits of the 
 *   vis state change.
 *
 * @param {{visState: !Object, renderAll: !Object, cgSel: !d3.Selection}} options
 *   - visState: The current state of the visualization.
 *   - renderAll: The object containing functions to render the visualization.
 *   - data: The data for the visualization, most importantly the graph nodes.
 *   - cgSel: The d3 selection for the control flow graph.
 */
window.initCgClerpList = function({visState, renderAll, data, cgSel}){
  let itemSel;
  let clerpListSel = cgSel.select('.clerp-list');

  const tokenValues = data.metadata.prompt_tokens;
  // const featureById = d3.group(data.features, d => d.featureId);

  // Function to render the clerp list
  function render() {
    let nodesByTokenByLayer =  d3.group(data.nodes, d => d.ctx_idx, d => d.streamIdx);

    const finalData = Array.from(nodesByTokenByLayer.entries())
      .sort((a, b) => a[0] - b[0])
      .map(d => {
        const layers = Array.from(d[1]);
        return {
          token: tokenValues[d[0]],
          values: layers.sort((a, b) => a[0] - b[0]),
        };
      });

    // Clear the previous content of the autointerp list
    clerpListSel.html('')
      .st({ padding: '2px' });

    const featuresSel = clerpListSel.append('div.features')
      .st({columns: '220px', columnFill: 'auto', height: '100%'});

    const tokenSel = featuresSel.appendMany('div.token', finalData)
      .st({
        position: 'relative',
        borderTop: 'solid 1px hsl(0 0 0 / 0.4)',
      })
      .at({ title: d => d.token });

    const tokenLabelSel = tokenSel.append('div')
      .st({
        fontSize: 11,
        color: 'hsl(0 0 0 /0.4)',
        fontWeight: '400',
        pointerEvents: 'none',
        padding: '2px',
        zIndex: 1e6,
        textWrap: 'nowrap',
        overflow: 'hidden',
        textOverflow: 'ellipsis',
        textAlign: 'center',
        marginTop: 5,
      });

    tokenLabelSel.append('span').text('“');
    tokenLabelSel.append('span')
      .text(d => util.ppToken(d.token))
      .st({
        background: 'hsl(55deg 0% 85% / 0.6)',
        borderRadius: 4,
        padding: '0 2px',
        color: 'black',
        fontWeight: '700',
      });
    tokenLabelSel.append('span').text('”');

    const layerSel = tokenSel
      .appendMany('div.layer', d => d.values)
      .st({ position: 'relative' });

    const nodeSel = layerSel.appendMany('div.node', d => d[1].entries().map(d => d[1]));

    itemSel = nodeSel.append('div.feature-row')
      .classed('clicked', e => e.nodeId == visState.clickedId)
      .classed('pinned', d => visState.pinnedIds.includes(d.nodeId));

    // Render the feature rows
    utilCg.renderFeatureRow(itemSel, visState, renderAll);

  }

  function test() {
    console.log("TESTING!");
  }
  function testNodes(d, newClerp) {
    console.log("TESTING 2!", d, newClerp);
  }

  renderAll.hClerpUpdate.fns.push(test);
  renderAll.hClerpUpdate.fns.push(testNodes);

  // Add fns to `renderAll`, to be called when clerp stuff needs updating 
  renderAll.hClerpUpdate.fns.push(render);
  renderAll.clickedId.fns.push(render);
  renderAll.hoveredId.fns.push(() => itemSel?.classed('hovered', e => e.featureId == visState.hoveredId));
  renderAll.pinnedIds.fns.push(() => itemSel?.classed('pinned', d => visState.pinnedIds.includes(d.nodeId)));

  // Add a function to scroll to the clicked item
  renderAll.clickedId.fns.push(() => {
    if (!itemSel || visState.isDev) return;

    const hNode = itemSel.filter(d => d.featureId == visState.clickedId).node();
    if (!hNode) return;
    const cNode = clerpListSel.node();

    let scrollTop = hNode.offsetTop - cNode.offsetTop - cNode.clientHeight / 2 + hNode.clientHeight / 2;
    scrollTop = d3.clamp(0, scrollTop, cNode.scrollHeight - cNode.clientHeight);
    if (scrollTop < cNode.scrollTop - cNode.clientHeight / 2 || scrollTop > cNode.scrollTop + cNode.clientHeight / 2) {
      cNode.scrollTop = scrollTop;
    }
  });

};

window.init?.();

// ── init-cg-feature-detail.js ──
/**
 * - Initializes the feature detail section of the control flow graph (CG).
 * - This section displays details about the currently selected or hovered feature.
 * - It includes the feature's name, its linear interpolation (clerp) value, and its 
 *   top/bottom logit/embedding effects.
 * - It is used to provide more context about the selected feature and its impact on
 *   the model's output.
 * - It is called from `init-cg.js`.
 * - It uses the `visState` object to keep track of the state of the visualization.
 * - It uses the `renderAll` object to manage re-rendering of the visualization.
 *
 * @param {{visState: !Object, renderAll: !Object, data: !Object, cgSel: !d3.Selection}} options
 *   - visState: The current state of the visualization.
 *   - renderAll: The object containing functions to render the visualization.
 *   - data: The data for the visualization, most importantly the graph nodes.
 *   - cgSel: The d3 selection for the control flow graph.
 */
window.initCgFeatureDetail = async function({visState, renderAll, data, cgSel}){
  // TODO(mcdougallc) - `data` is actually window.graphMetadata?
  const sel = cgSel.select('.feature-detail').html(''); 
  if (!sel.node()) return;

  const headerSel = sel.append('div.feature-header');
  const logitsSel = sel.append('div.logits-container');
  const examplesSel = sel.append('div.feature-examples-container');
  const featureExamples = await window.initFeatureExamples({
    containerSel: examplesSel, 
    showLogits: true,
    // showLogits: !data.nodes.some(d => d.top_logit_effects)
    // we show logits ourselves frozen above the feature vis, don't also show it inside
  });

  let editOpen = false;

  // Throttle the rendering of feature examples to prevent lag when mousing over
  const renderFeatureExamples = util.throttleDebounce(featureExamples.renderFeature, 100);

  function renderFeatureDetail() {
    // Clear the previous content of the logits container and set its display to visible
    logitsSel.html('').st({display:''});

    // Determine the node to display details for. If a node is clicked then we
    // display that one, if not then we display a hovered node if it exists.
    let d = null;
    if (!d) d = data.nodes.find(e => e.nodeId === visState.clickedId);
    if (!d){
      const featureId = visState.hoveredId;
      if (!featureId || featureId.includes('supernode')){

        headerSel.html('')
          .append('div.no-selected-feature').text("Click or hover to see a feature's examples");

        examplesSel.st({opacity: 0});
        return;
      }
      return;
    }

    // Determine the label for the feature, based on whether it's a temporary 
    // feature, hidden layer, or other. Note that the hidden layer label is just
    // for IP protection purposes and we won't need to use it.
    const label = d.isTmpFeature ? d.featureId : 
      visState.isHideLayer ? `#F${d.featureIndex}` : 
      `${utilCg.layerLocationLabel(d.layer, d.probe_location_idx)}/${d.featureIndex}`;

    // Display information for this node. 
    // We treat embedding nodes, error nodes and logit nodes separately (they 
    // only write / write / read respectively, so they have less data).
    if (d.isError || d.node_type == 'embedding' || d.node_type == 'logit'){
      examplesSel.st({opacity: 0});

      headerSel.html('').append('div.header-top-row').append('div.feature-title')
        .text(d.ppClerp);

    // Latent nodes have all the data: embeddings and logit effects.
    // TODO(mcdougallc) - try toggling edit mode, seems here it's hardcoded to
    // "off" but could be valuable!
    } else if (d.node_type == 'latent') {
      const headerTopRowSel = headerSel.html('').append('div.header-top-row');
      headerTopRowSel.append('div.feature-title')
        .html(`Feature&nbsp;<a style="color: inherit;" href="${d.url}" target="_blank">${label}</a>`);

      headerTopRowSel.append('div.pp-clerp')
        .text(d.ppClerp)
        .at({title: d.ppClerp});

      // If edit mode is enabled, add an edit button to manually change the
      // "clerp" value of a feature.
      if (visState.isEditMode){
        function toggleEdit() {
          editOpen = !editOpen;
          hClerpEditSel.st({display: editOpen ? 'flex' : 'none'});
          if (editOpen) {
            headerSel.select('input').node()?.focus();
          }
        }
        headerTopRowSel.append('button.edit-clerp-button')
          .text('Edit')
          .on('click', toggleEdit);

        const hClerpEditSel = headerSel.append('div.clerp-edit')
          .st({ display: editOpen ? 'flex' : 'none' });

        const hClerpSel = hClerpEditSel.append('div')
          .st({ display: 'flex' });
        hClerpSel.append('div')
          .st({flex: '0 0 50px'})
          .text(`🧑💻`);
        hClerpSel.append('input').data([d])
          .at({ value: d.localClerp })
          .st({flex: '1 0 0', whiteSpace: 'normal', fontSize: 12, fontFamily: 'system-ui'})
          .on('change', ev => {
              // TODO(mcdougallc) - not sure what the difference is between these 3
              // clerp fields, assuming one is for editing and overwriting the others,
              // But I find that only changing `d.clerp` works, not `d.ppClerp` or
              // `d.localClerp`, but I'll eventually get around to this.
              d.clerp = ev.target.value;
              renderAll.hClerpUpdate();
          });

        const rClerpSel = hClerpEditSel.append('div')
            .st({ display: 'flex' });
          rClerpSel.append('div')
            .st({flex: '0 0 50px'})
            .text(`🧑☁️`);
          rClerpSel.append('div')
            .text(d.remoteClerp)
            .st({flex: '1 0', whiteSpace: 'normal'});

        const clerpSel = hClerpEditSel.append('div')
          .st({ display: 'flex' });
        clerpSel.append('div')
          .st({flex: '0 0 50px'})
          .text(`🤖💬`);
        clerpSel.append('div')
          .text(d.clerp)
          .st({ flex: '1 0', whiteSpace: 'normal' });
      }

      // Load and render sae_vis components (if this is a latent node)
      featureExamples.loadFeature(data.metadata.scan, d.layer, d.featureIndex);
      renderFeatureExamples(data.metadata.scan, d.layer, d.featureIndex);
      examplesSel.st({opacity: 1});
    } else {

      // Default info for other types of nodes
      // TODO(mcdougallc) - not sure when this actually gets called
      headerSel.html(`<b>${label}</b>`);
      logitsSel.html('No logit data');
      examplesSel.st({opacity: 0});
    }

    // add pinned/click state and toggle to feature-title
    headerSel.select('div.feature-title')
      .classed('pinned', d.nodeId && visState.pinnedIds.includes(d.nodeId))
      .classed('hovered', visState.clickedId == d.nodeId)
      .on('click', ev => {
        utilCg.clickFeature(visState, renderAll, d, ev.metaKey || ev.ctrlKey);

        if (visState.clickedId) return;
        // double render to toggle on hoveredId, could expose more of utilCg.clickFeature to prevent
        visState.hoveredId = d.featureId;
        renderAll.hoveredId();
      });

  }

  renderAll.hClerpUpdate.fns.push(renderFeatureDetail);
  renderAll.clickedId.fns.push(renderFeatureDetail);
  renderAll.hoveredId.fns.push(renderFeatureDetail);
  renderAll.pinnedIds.fns.push(renderFeatureDetail);

  renderFeatureDetail();
};
